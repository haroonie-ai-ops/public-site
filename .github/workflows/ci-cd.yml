# CI/CD pipeline — R-6.1, R-6.2, R-6.3, R-6.6, R-6.7 (REQ-001).
#
# One workflow, four jobs:
#   validate        — install, lint, build, Playwright (R-6.1 AC1). Runs on
#                      every PR into main and on every push to main.
#   deploy-preview   — PR-only. Builds with SITE_ENV=preview (R-4.4 / R-6.2
#                      AC2) and deploys to a Cloudflare Pages preview
#                      environment, then reports the URL on the PR (R-6.2
#                      AC1). Gated on `validate` succeeding.
#   deploy-production — main-only. Deploys to the Cloudflare Pages
#                      production environment (R-6.3 AC1). Gated on
#                      `validate` succeeding — a failing job upstream means
#                      GitHub Actions skips this job outright, satisfying
#                      R-6.3 AC2 ("failing tests -> no deployment") by the
#                      platform's own `needs:` semantics, not custom logic.
#                      TEMPORARILY builds with SITE_ENV=prelaunch (non-
#                      indexable) rather than the unset/indexable default —
#                      see the "TEMPORARY E6 GATE" comment on that job's
#                      Build step for the owner decision, why, and the exact
#                      condition under which to remove it.
#   post-deploy-verify — main-only, gated on deploy-production succeeding.
#                      REQ-001-A2 / R-7.8: runs the production-hostname
#                      Playwright suite (playwright.production.config.ts)
#                      against the real https://www.haroonie.ai/ — the ONLY
#                      point in this pipeline that traverses the real
#                      Cloudflare zone proxy, where Bot Fight Mode's script
#                      injection (and therefore R-7.5 AC2) actually occurs
#                      (QA-005 Finding 2). Scoped ONLY to R-7.8's checks —
#                      it is not R-6.4's still-unbuilt, separately-planned
#                      "all pages 200 + heading present" smoke suite
#                      (deferred to Wave 7 per PLAN-001); this job exists
#                      because R-7.8 explicitly requires a post-deployment
#                      gate and none existed yet for it to attach to
#                      additively (R-7.8 AC6).
#                      As of Wave 7 this job ALSO runs R-6.4's smoke suite
#                      (production-smoke.spec.ts): all six routes 200, the
#                      home primary heading present, and a coarse staleness
#                      check. R-6.4 asks whether the site is up at all, which
#                      a deploy can fail while satisfying every R-7.8
#                      security assertion.
#
# R-6.1 AC2's enforcement half ("cannot be merged") is NOT implemented here.
# It requires branch protection / a repository ruleset with a required
# status check, and both return HTTP 403 ("Upgrade to GitHub Pro or make
# this repository public") on this private GitHub Free repository — a plan
# gate, not something this workflow can work around. See status/STATUS.md
# (E8) for the three owner options. This workflow still fully reports pass/
# fail on the PR (AC1's contribution to AC2, and everything AC1 itself asks
# for) — merging past a red check is possible today only because of E8, not
# because this workflow fails to report it.
#
# R-6.6 (secrets hygiene): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are
# read only from repository secrets, never echoed, and only the wrangler
# action step (which itself masks known secret values in its own output) and
# the credential-check step (which never prints the value, only whether it
# is empty) touch them.
#
# The Cloudflare Pages project itself (`haroonie-ai-public-site`) is created
# once, out of band, by the workflow_dispatch job in
# bootstrap-pages-project.yml — not auto-created here. A silent
# create-on-deploy here would turn a typo'd project name into a brand-new
# empty project instead of a loud, obvious failure.
#
# R-6.7 (reproducible builds): `npm ci` (never `npm install`) against the
# committed package-lock.json, and Node pinned via `.nvmrc`
# (actions/setup-node's `node-version-file` reads it directly, so CI can
# never drift from the version pinned in R-1.2).
#
# Every third-party action below is pinned to a specific upstream commit SHA
# (comment carries the human-readable tag) rather than a mutable version
# tag, so a compromised tag re-point cannot silently change what this
# pipeline executes.

name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Superseding pushes to the same PR (or the same ref) cancel the in-flight
# run instead of queuing behind it — this project pays for compute, not just
# time, and a stale run's result is moot once new commits exist.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No blanket write permissions. Each job below re-declares exactly the scope
# it needs; anything not listed here or in a job is implicitly `none`.
permissions:
  contents: read

env:
  CLOUDFLARE_PAGES_PROJECT: haroonie-ai-public-site

jobs:
  # R-1.4 AC1 — "no credential material is present; all secrets are referenced
  # by environment variable... Verified by: secret scan in CI."
  #
  # That clause described a control that did not exist. The R-8.1 traceability
  # matrix found it: there was no scanner in this workflow, and GitHub's own
  # secret_scanning and push protection were both DISABLED on the repository.
  # The only clean scan was a one-off manual check of 91 commits before the
  # repo went public. The criterion had been reading as satisfied on the
  # strength of a sentence.
  #
  # Both halves are now real. The owner enabled secret scanning and push
  # protection (platform-level, blocks a push containing a known provider
  # pattern), and this job adds the per-commit gate the AC actually names.
  # They are complementary rather than redundant: push protection stops known
  # provider tokens at the boundary, gitleaks scans the diff for generic
  # high-entropy material and repo-specific patterns, and it runs where a
  # failure blocks a merge.
  #
  # A separate job, not a step in `validate`: it needs full history
  # (fetch-depth: 0) to scan commits rather than just the working tree, and
  # `validate` deliberately checks out shallow for speed. It also runs in
  # parallel, so it costs no wall-clock on the critical path.
  secret-scan:
    name: Secret scan (R-1.4)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action uploads its findings as SARIF to code scanning, so
      # anything it detects lands in the Security tab rather than only in a
      # job log a failing build buries. That upload needs this scope: with
      # `contents: read` alone the scan itself passed but the
      # `github-advanced-security` check went red on the upload, which reads
      # exactly like a found secret and is not one.
      security-events: write
    steps:
      - name: Checkout (full history — a shallow clone cannot scan commits)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Install, lint, build, Playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # R-6.7 — locked dependency versions, never a fresh resolve.
      - name: Install dependencies (npm ci)
        run: npm ci

      # R-6.1 AC1 — lint. Four gates in one chained script: `astro check`,
      # `tsc --noEmit` over the site's tsconfig, `tsc --noEmit` over the
      # Pages Function's tsconfig, then `eslint .`.
      #
      # Through Waves 1-6 this step was type-checking only. QA-003 Finding 1
      # recorded that as an unresolved requirements ambiguity — the AC's
      # letter satisfied, its substance narrower than "lint" conventionally
      # promises. Resolved 2026-09-17 by owner decision (quoted in full at
      # the top of eslint.config.mjs): add a real linter. ESLint is additive
      # — the type-check passes are unchanged and still gate this step.
      #
      # Any one of the four exiting non-zero fails this step, which fails
      # the `validate` job, which skips both deploy jobs via `needs:
      # validate` and reports the PR red against the `main` ruleset's
      # required status check.
      #
      # The job's `name:` above is deliberately NOT changed: it is the
      # literal string registered in ruleset 23484592's
      # `required_status_checks`, and renaming it would silently detach
      # R-6.1 AC2's enforcement.
      - name: Lint (astro check + tsc --noEmit + eslint)
        run: npm run lint

      # R-6.1 AC1 — build. Production settings (SITE_ENV unset), proves the
      # exact command R-1.2 documents actually exits 0 in a clean CI runner,
      # independent of whatever env the later deploy builds use.
      - name: Build
        run: npm run build

      # Speeds up repeat runs; playwright's own installer skips a browser
      # it finds already present at this path, so a cache hit only saves
      # download time and never masks a genuinely missing browser (the
      # install step below always runs regardless of cache outcome).
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (+ OS deps)
        run: npx playwright install --with-deps chromium firefox webkit

      # R-6.1 AC1 — the Playwright suite. playwright.config.ts is already
      # CI-aware (forbidOnly, retries: 2, workers: 1, github reporter) —
      # nothing here overrides or weakens that.
      - name: Run Playwright suite
        run: npm test

      # Failure Policy step 1 ("collect Playwright evidence") — the HTML
      # report and any trace/screenshot/video the config captures on retry,
      # uploaded on every run (not just failure) so a passing run's report
      # is available too. Never blocks the job on upload issues.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-preview:
    name: Deploy PR preview (Cloudflare Pages)
    needs: [validate, secret-scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # R-6.6 — never print the secret; only ever check whether it is
      # present, and fail loudly (not skip quietly) if it isn't. This used
      # to soft-pass (skip the deploy, still report job success) while E5's
      # token value was outstanding — that was a defensible interim stance
      # while the token genuinely didn't exist yet, but it is a live gate
      # weakness now that it does: a deleted or expired secret would
      # silently turn a production deploy into a green no-op. Hard-fail
      # instead so a credential gap is always loudly red, never a quiet
      # skip. (Secrets cannot be referenced in `if:` conditionals at all —
      # confirmed against GitHub's own context-availability docs — so this
      # check has to run inside a step like this one.)
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secret is missing. Failing loudly rather than skipping the preview deploy quietly — a credential gap must never look like a successful no-op."
            exit 1
          fi

      # R-6.2 / R-4.4 — SITE_ENV=preview flips src/pages/robots.txt.ts to
      # "Disallow: /" so this preview build is excluded from indexing.
      - name: Build (SITE_ENV=preview)
        run: npm run build
        env:
          SITE_ENV: preview

      - name: Deploy to Cloudflare Pages (preview)
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.head_ref }}

      # R-6.2 AC1 — report the unique preview URL on the PR. Idempotent: it
      # edits its own prior comment on re-runs instead of piling up a new
      # one per push.
      - name: Report preview URL on the pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = '<!-- haroonie-ai-preview-deploy -->';
            const deploymentUrl = `${{ steps.deploy.outputs.deployment-url }}`;
            const aliasUrl = `${{ steps.deploy.outputs.pages-deployment-alias-url }}`;
            const body = [
              marker,
              '### Cloudflare Pages preview deployed',
              '',
              `- Unique deployment URL: ${deploymentUrl}`,
              aliasUrl ? `- Branch alias URL: ${aliasUrl}` : null,
              '',
              '_Excluded from search indexing (`SITE_ENV=preview` -> `robots.txt: Disallow: /`, R-4.4)._',
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-production:
    name: Deploy production (Cloudflare Pages)
    needs: [validate, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # See the identical step in deploy-preview above for why this hard-
      # fails instead of skipping quietly.
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secret is missing. Failing loudly rather than skipping the production deploy quietly — a credential gap must never look like a successful no-op."
            exit 1
          fi

      # ============================================================
      # TEMPORARY E6 GATE — DO NOT REMOVE WITHOUT READING THIS COMMENT.
      # ============================================================
      # Owner decision, 2026-09-13 (per the Project Manager's PM-002
      # assessment, put to the owner directly): Cloudflare Pages production
      # is "production" under R-6.3's own definition regardless of how
      # sparse today's real content is, and it is indexable. ~10 rows in
      # status/placeholder-content.md are still open with no owner copy
      # sign-off (Services, About, and the Privacy/Terms policy bodies).
      # REQ-001 §1.3 forbids placeholder content reaching a searchable
      # production audience, so the owner chose to keep production
      # non-indexable until real E6 copy lands, rather than ship it
      # indexable in its current state.
      #
      # SITE_ENV=prelaunch below is a distinct value from SITE_ENV=preview
      # (R-4.4's PR-preview value, set in deploy-preview above) — this is
      # the actual production deploy, just temporarily forced non-indexable.
      # It works by relying on src/pages/robots.txt.ts's existing
      # isPreviewBuild() logic, which already treats *any* SITE_ENV value
      # other than "production" as non-indexable — that logic is NOT
      # changed here, and must not be: an *unset* SITE_ENV must keep
      # falling through to indexable (see that file's own comment and
      # tests/seo-preview.spec.ts's SITE_ENV=Production / unset-equivalent
      # coverage). Only this job's explicit value changes.
      #
      # REMOVAL CONDITION — read before deleting: once E6 lands (real,
      # owner-approved copy for every row currently open in
      # status/placeholder-content.md) and that register is empty, or every
      # remaining row is explicitly waived by the owner (this program's
      # Wave 7 go-live exit criteria), delete the `env:` block on this step.
      # That single deletion is sufficient to restore indexing — nothing
      # else in this repository depends on the literal string "prelaunch",
      # and no other file needs to change alongside it.
      #
      # R-6.3 AC1 — production build.
      - name: Build
        run: npm run build
        env:
          SITE_ENV: prelaunch

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main

  post-deploy-verify:
    name: Verify production hostname (R-6.4 smoke + R-7.8 security)
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright browsers (+ OS deps)
        run: npx playwright install --with-deps chromium firefox webkit

      # R-7.8 — the only suite in this pipeline that ever requests the real
      # production hostname through the Cloudflare zone proxy (QA-005
      # Finding 2). A deliberately separate Playwright config
      # (playwright.production.config.ts) from the `validate` job's
      # `npm test` above — this never runs as part of the fast pre-merge
      # gate (R-7.8 AC6).
      - name: Run production-hostname verification suite (R-7.8)
        run: npm run test:production
        env:
          PRODUCTION_BASE_URL: https://www.haroonie.ai

      - name: Upload production verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-production
          path: |
            playwright-report-production/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # R-7.8 AC5 — a failing run must be surfaced as a CI failure (the step
      # above already does that by exiting non-zero, which fails this job)
      # AND a rollback recommendation must be RECORDED, not merely logged in
      # a scrollable step log. Written to the job summary so it is the first
      # thing a human sees, and persists as long as the run does.
      #
      # R-6.5 (a documented rollback procedure) does not exist yet as of
      # this commit (deferred to Wave 7 per PLAN-001) — the interim guidance
      # below is the Cloudflare Pages dashboard's own rollback feature and
      # API, not a wrapper this program has built or verified.
      # R-6.4 AC2 and R-7.8 AC5 both require that a failing post-deploy run
      # record a rollback recommendation rather than merely log a failure.
      - name: Record rollback recommendation on failure
        if: failure()
        run: |
          {
            echo "## Production verification FAILED (R-6.4 smoke / R-7.8 security)"
            echo ""
            echo "The post-deployment suite failed against https://www.haroonie.ai/"
            echo "after deploying commit \`${{ github.sha }}\`."
            echo ""
            echo "WHICH QUESTION FAILED matters, so read the report before acting:"
            echo "- production-smoke.spec.ts (R-6.4) - the site is down, a route did"
            echo "  not return 200, or a page served without its own content."
            echo "- production-security.spec.ts (R-7.8) - the site is up, but a CSP"
            echo "  regression, a missing header, or a console/JS-transfer regression"
            echo "  occurred. R-7.5 AC2 and R-7.8 AC1 are acceptance criteria, not"
            echo "  soft warnings."
            echo ""
            echo "BEFORE ROLLING BACK, rule out a false alarm. Cloudflare Bot Fight"
            echo "Mode challenges non-browser clients from GitHub runner IPs and has"
            echo "twice produced a red job on a healthy site (QA-005 Finding 3). The"
            echo "suite self-diagnoses this: a challenge failure names itself in the"
            echo "error text. If every failure is a challenge, the site is fine."
            echo ""
            echo "RECOMMENDED ACTION: follow status/ROLLBACK-PROCEDURE.md, which is"
            echo "documented and has been drilled on production (R-6.5 - both"
            echo "directions well inside the 10-minute bound)."
            echo ""
            echo "DO NOT verify a rollback by loading the page. Consecutive"
            echo "deployments are frequently byte-identical, and production HTML"
            echo "changes on every request because Cloudflare injects a per-request"
            echo "CSP nonce. Verify canonical_deployment.id via the dashboard or API."
            echo "That is the drill's main finding, and it has already misled once."
          } >> "$GITHUB_STEP_SUMMARY"
