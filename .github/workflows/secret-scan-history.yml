# Full-history secret scan — R-1.4 AC1.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM ci-cd.yml.
#
# R-1.4 AC1 reads "Given the repository AT ANY COMMIT, When scanned, Then no
# credential material is present." QA-006 Finding 5 established that the
# `secret-scan` job in ci-cd.yml does not discharge that, and that the
# traceability matrix claimed it did: `gitleaks-action` scans only the event's
# commit range on `push` and `pull_request`, and under this repository's
# squash-merge style a push to `main` is a single commit. `fetch-depth: 0` is
# necessary for that range to resolve but is not itself a full-history scan.
# The action walks the whole history only under `schedule` or
# `workflow_dispatch`.
#
# Those triggers could have been added to ci-cd.yml, and were not. That file's
# later jobs deploy to Cloudflare Pages; they are guarded on `github.event_name`
# today, but arming a weekly trigger on a pipeline that can deploy makes the
# safety of production deployments depend on those guards staying correct
# forever. A separate workflow cannot deploy anything, whatever it is given.
#
# The per-commit gate in ci-cd.yml is unchanged and is still the required
# merge check. This is the periodic sweep behind it, and the two answer
# different questions: "does this change introduce a secret" versus "does the
# history contain one".
name: Secret scan — full history (R-1.4 AC1)

on:
  # Weekly, not nightly: history only grows as commits land, a secret already
  # in history is no more dangerous eight hours later, and anything newly
  # introduced is caught pre-merge by ci-cd.yml's gate instead.
  schedule:
    - cron: '17 5 * * 1'
  # So the scan can be run on demand after a history rewrite, or to produce
  # evidence on request without waiting for Monday.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history:
    name: gitleaks over the entire history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Findings upload as SARIF to code scanning so they land in the Security
      # tab rather than only in a job log. Without this scope the scan passes
      # and the `github-advanced-security` check goes red on the upload, which
      # reads exactly like a found secret and is not one.
      security-events: write
    steps:
      - name: Checkout (full history — a shallow clone cannot scan commits)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Same pinned SHA as ci-cd.yml's job, deliberately: the two must not
      # drift into scanning with different rule sets.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
