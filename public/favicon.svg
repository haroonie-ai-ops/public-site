<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!--
    R-9.7 AC1: /favicon.svg must return the haroonie.ai logo mark, NOT the
    Astro starter favicon. This file shipped unchanged from the scaffold
    through the entire brand wave: the <head> was re-pointed at
    /brand/haroonie-logo-mark.svg while this URL - which the criterion names
    explicitly - kept serving Astro's triangle. Found by QA-006.

    R-9.9 AC4: the mark must stay legible against dark browser chrome, and
    the starter file this replaces did that with an internal
    prefers-color-scheme rule, so losing it would trade one defect for
    another. It is not decorative here: measured against a typical dark
    chrome (#202124), the mark's darkest stop #155BEF is only 2.89:1, under
    the 3:1 floor, while #66B4FF reaches 7.31:1. The dark block below shifts
    the palette up one step - Royal -> Bright, Bright -> Light - so the mark
    keeps its shape and identity rather than being recoloured into something
    else.

    Colours are declared as custom properties so the two schemes differ by
    three values, not by two copies of the artwork.
  -->
  <style>
    :root {
      --m-deep: #155BEF;
      --m-mid: #2E83FF;
      --m-light: #66B4FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --m-deep: #2E83FF;
        --m-mid: #66B4FF;
        --m-light: #A8D3FF;
      }
    }
  </style>
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--m-mid)"/>
      <stop offset="100%" stop-color="var(--m-deep)"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--m-deep)"/>
      <stop offset="100%" stop-color="var(--m-mid)"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="var(--m-light)"/>
      <stop offset="40%" stop-color="var(--m-mid)"/>
      <stop offset="100%" stop-color="var(--m-deep)"/>
    </linearGradient>
  </defs>
  <!-- Left stem of H -->
  <path d="M18 98 L18 28 L38 12 L42 16 L42 86 L28 98 Z" fill="url(#leftGrad)"/>
  <path d="M18 28 L38 12 L42 16 L22 32 Z" fill="var(--m-light)" opacity="0.7"/>
  <!-- Right stem of H -->
  <path d="M62 86 L62 22 L82 8 L86 12 L86 76 L72 88 Z" fill="url(#rightGrad)"/>
  <path d="M62 22 L82 8 L86 12 L66 26 Z" fill="var(--m-light)" opacity="0.65"/>
  <!-- Connecting ribbon -->
  <path d="M28 58 C40 48, 50 52, 58 48 C66 44, 72 38, 80 42 L78 52 C70 48, 64 54, 56 58 C46 64, 38 62, 30 68 Z" fill="url(#ribbonGrad)"/>
  <!--
    Pixel cluster. R-9.7 AC5 permits this detail to simplify or drop at
    16x16 - it is sub-pixel there and cannot survive - but it is kept in the
    vector so the mark is correct at every size a browser actually picks it
    for (tab strips render well above 16 on modern displays).
  -->
  <rect x="84" y="10" width="7" height="7" rx="1" fill="var(--m-mid)"/>
  <rect x="93" y="6" width="6" height="6" rx="1" fill="var(--m-mid)" opacity="0.85"/>
  <rect x="90" y="16" width="5" height="5" rx="0.8" fill="var(--m-light)"/>
  <rect x="99" y="12" width="4.5" height="4.5" rx="0.7" fill="var(--m-deep)" opacity="0.75"/>
  <rect x="96" y="22" width="4" height="4" rx="0.6" fill="var(--m-mid)" opacity="0.6"/>
  <rect x="104" y="8" width="3.5" height="3.5" rx="0.5" fill="var(--m-light)" opacity="0.55"/>
  <rect x="102" y="18" width="3" height="3" rx="0.4" fill="var(--m-deep)" opacity="0.4"/>
  <rect x="108" y="14" width="2.5" height="2.5" rx="0.3" fill="var(--m-mid)" opacity="0.35"/>
</svg>
